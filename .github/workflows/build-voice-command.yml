name: Build voice-command app

# Path-filtered: only fires when the voice-command client or this workflow
# changes. We don't want every C++/prompt tweak rebuilding the installers.
on:
  push:
    branches: [main]
    paths:
      - 'tools/voice-command/**'
      - '.github/workflows/build-voice-command.yml'
  pull_request:
    branches: [main]
    paths:
      - 'tools/voice-command/**'
      - '.github/workflows/build-voice-command.yml'
  workflow_dispatch:

permissions:
  # Release jobs and matrix uploads use the repository token.
  contents: write

env:
  GH_REPO: ${{ github.repository }}
  # Failed-job retries reuse uploads from successful matrix jobs.
  STAGING_TAG: voice-command-build-${{ github.run_id }}

concurrency:
  # Let a running publication finish before the next one starts.
  group: build-voice-command-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  prepare-release:
    name: Create draft for installer transfer
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create staging release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "$STAGING_TAG" --json isDraft --jq '.isDraft' 2>/dev/null | grep -qx true; then
            exit 0
          fi
          gh release create "$STAGING_TAG" \
            --target "$GITHUB_SHA" \
            --title "Voice-command build $GITHUB_RUN_ID" \
            --notes "Installer staging for workflow run $GITHUB_RUN_ID." \
            --draft

  build:
    name: Package (${{ matrix.os }})
    needs: prepare-release
    # Check builds must run when publication is skipped.
    if: ${{ !cancelled() && (needs.prepare-release.result == 'success' || needs.prepare-release.result == 'skipped') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            out: WoW-Voice-Command.dmg
          - os: windows-latest
            out: WoWVoiceCommand.exe
    defaults:
      run:
        working-directory: tools/voice-command
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # create-dmg makes the pretty drag-to-Applications DMG; dmgbuild is the
      # pip fallback already in requirements-build.txt.
      - name: Install create-dmg (macOS)
        if: runner.os == 'macOS'
        run: brew install create-dmg
        working-directory: ${{ github.workspace }}

      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          # cmake/ninja help any source-built native wheels (e.g. pywhispercpp).
          pip install cmake ninja
          pip install -r requirements-build.txt

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: bash packaging/build-macos.sh

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File packaging/build-windows.ps1

      - name: Compute SHA256 (macOS)
        if: runner.os == 'macOS'
        run: (cd dist && shasum -a 256 "${{ matrix.out }}") | tee "dist/${{ matrix.out }}.sha256"

      - name: Compute SHA256 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $h = Get-FileHash "dist/${{ matrix.out }}" -Algorithm SHA256
          "$($h.Hash.ToLower())  ${{ matrix.out }}" | Tee-Object "dist/${{ matrix.out }}.sha256"

      - name: Upload installers to staging release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload "$STAGING_TAG" \
            "dist/${{ matrix.out }}" \
            "dist/${{ matrix.out }}.sha256" --clobber

  release:
    name: Publish rolling release
    needs: [prepare-release, build]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download built installers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release download "$STAGING_TAG" --dir dist \
            --pattern WoW-Voice-Command.dmg \
            --pattern WoW-Voice-Command.dmg.sha256 \
            --pattern WoWVoiceCommand.exe \
            --pattern WoWVoiceCommand.exe.sha256
          cd dist
          # Require both installers and check each checksum before publication.
          test -s WoW-Voice-Command.dmg
          test -s WoWVoiceCommand.exe
          test -s WoW-Voice-Command.dmg.sha256
          test -s WoWVoiceCommand.exe.sha256
          sha256sum --check WoW-Voice-Command.dmg.sha256
          sha256sum --check WoWVoiceCommand.exe.sha256

      - name: Stage release assets + notes
        run: |
          set -euo pipefail
          ls -la dist/
          {
            echo "Rolling release built from \`main\` by CI."
            echo ""
            echo "**Commit**: [\`${GITHUB_SHA}\`](https://github.com/${{ github.repository }}/commit/${GITHUB_SHA})"
            echo "**Built at**: $(date -u +"%Y-%m-%d %H:%M UTC")"
            echo ""
            echo "## Downloads"
            echo "- **macOS**: \`WoW-Voice-Command.dmg\` — open, drag to Applications. First launch: right-click → Open (unsigned). Grant Microphone + Accessibility."
            echo "- **Windows**: \`WoWVoiceCommand.exe\` — portable, no install. SmartScreen → More info → Run anyway (unsigned)."
            echo ""
            echo "Setup + first-run model download: see [\`docs/voice-command-app.md\`](https://github.com/${{ github.repository }}/blob/main/docs/voice-command-app.md)."
            echo ""
            echo "## SHA256"
            echo '```'
            cat dist/*.sha256 || true
            echo '```'
            echo ""
            echo "Auto-published on every merge to \`main\` touching \`tools/voice-command/**\`. The tag re-anchors each time, so the URL is stable but the SHA moves."
          } > /tmp/notes.md
          cat /tmp/notes.md

      - name: Publish rolling release voice-command-latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release delete voice-command-latest --yes --cleanup-tag || true
          gh release create voice-command-latest \
            --target "${GITHUB_SHA}" \
            --title "WoW Voice Command (latest from main)" \
            --notes-file /tmp/notes.md \
            --prerelease \
            dist/*
          # Draft releases have no Git tag.
          gh release delete "$STAGING_TAG" --yes
